<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">Correlator-level convergence</title>
<desc id="d">Two panels. Left: the correlator error against the lattice scale N at fixed time 0.5, falling on a straight line of slope four per step for k equal to 0, 1 and 2. Right: the error against time at N = 8, bounded for k equal to 0 and 1 but rising sharply for k equal to 2 beyond t about 1.5.</desc>
