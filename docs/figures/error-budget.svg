<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d">
<title id="t">The error budget of Theorem S1(i)</title>
<desc id="d">The static vacuum term and the dynamics term of Theorem S1(i) against the ultraviolet scale N at M = 3, T = 1, d = 1. On the chiral algebra both fall as 4 to the minus N and stay parallel, so their ratio is fixed by M, T and the degrees. On the full two-component algebra the static term falls only as 2 to the minus r, half the slope, and overtakes the dynamics term.</desc>
