  .s0 { stroke: #0969da; } .s1 { stroke: #cf222e; } .s2 { stroke: #1a7f37; }
  .s3 { stroke: #9a6700; } .s4 { stroke: #8250df; } .s5 { stroke: #57606a; }
  .f0 { fill: #0969da; } .f1 { fill: #cf222e; } .f2 { fill: #1a7f37; }
  .f3 { fill: #9a6700; } .f4 { fill: #8250df; } .f5 { fill: #57606a; }
